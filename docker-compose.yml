services:
  manager:
    build:
      context: .
      dockerfile: vm/Dockerfile
    container_name: ubuntu-session-manager
    restart: unless-stopped
    cpus: "4"
    mem_limit: 10g
    command: ["python3", "/app/server.py", "serve"]
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:-109}"
    network_mode: host
    environment:
      VM_CPUS: "${VM_CPUS:-2}"
      VM_RAM: "${VM_RAM:-4G}"
      VM_DISK_GB: "${VM_DISK_GB:-32}"
      MAX_SESSIONS: "${MAX_SESSIONS:-2}"
      GUAC_JSON_SECRET: "${GUAC_JSON_SECRET:-}"
      MANAGER_BIND_HOST: "172.30.0.1"
      MANAGER_BIND_PORT: "6081"
      VNC_BIND_HOST: "172.30.0.1"
    env_file:
      - ./vm-data/guac.env
    volumes:
      - ./vm-data:/data
      - ./drop:/drop
      - ./vm:/setup:ro
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: ubuntu-guacd
    restart: unless-stopped
    network_mode: host
    command: ["-b", "172.30.0.1"]
    extra_hosts:
      - "host.docker.internal:172.30.0.1"
    cpus: "1"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "nc", "-z", "172.30.0.1", "4822"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: ubuntu-guacamole
    restart: unless-stopped
    depends_on:
      - guacd
    environment:
      GUACD_HOSTNAME: host.docker.internal
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: "${GUAC_JSON_SECRET:-}"
      WEBAPP_CONTEXT: guacamole
    extra_hosts:
      - "host.docker.internal:172.30.0.1"
    cpus: "1"
    mem_limit: 1g
    networks:
      desktop:
        ipv4_address: 172.30.0.3
  gateway:
    image: nginx:1.28-alpine
    container_name: ubuntu-gateway
    restart: unless-stopped
    network_mode: host
    depends_on:
      - manager
      - guacamole
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    cpus: "0.5"
    mem_limit: 256m
    stop_grace_period: 30s

networks:
  desktop:
    name: ubuntu-desktop
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
