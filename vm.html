<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ubuntu VM Sessions</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; }
    main { width: min(42rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #374151; border-radius: 1rem; background: #1f2937; }
    h1 { margin-top: 0; }
    a { display: inline-block; margin-top: 1rem; padding: .8rem 1.2rem; border-radius: .5rem; background: #2563eb; color: white; font-weight: 700; text-decoration: none; }
    p { line-height: 1.6; color: #d1d5db; }
  </style>
</head>
<body>
  <main>
    <h1>Ubuntu VM sessions</h1>
    <p>Start the session service with <code>./start-vm.sh</code>, then open the sign-in page. Administrators create accounts; public signup is disabled.</p>
    <a id="connect" href="#">Open session sign-in</a>
  </main>
  <script>
    const base = location.protocol === "file:"
      ? "http://127.0.0.1:6080"
      : location.origin;
    document.getElementById("connect").href = base;
  </script>
</body>
</html>
